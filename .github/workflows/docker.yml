name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t app-review .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ai-projects
            git pull
            sudo docker build -t app-review .
            sudo docker stop $(sudo docker ps -q) || true
            sudo docker run -d -p 80:8000 -e ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} -e DATABASE_URL=${{ secrets.DATABASE_URL }} app-review
